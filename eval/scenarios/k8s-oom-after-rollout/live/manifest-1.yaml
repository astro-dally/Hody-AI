apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
      - name: search
        image: python:3.12-slim
        command: ["python", "-c", "import time; x = bytearray(200*1024*1024); time.sleep(3600)"]
        resources:
          requests:
            memory: 256Mi
          limits:
            memory: 512Mi
