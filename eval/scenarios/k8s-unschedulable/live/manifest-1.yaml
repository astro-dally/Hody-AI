apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trainer
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trainer
  template:
    metadata:
      labels:
        app: trainer
    spec:
      containers:
      - name: trainer
        image: busybox:1.36
        command: ["sleep", "3600"]
        env:
        - name: GITHUB_TOKEN
          value: github_pat_11CNRYK4AA0abcdefghijklmn_opqrstuvwxyz0123
        resources:
          requests:
            memory: 64Mi
          limits:
            memory: 64Mi
