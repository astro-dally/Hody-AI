apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
    spec:
      containers:
      - name: ledger
        image: busybox:1.36
        command: ["sh", "-c", "echo starting; echo 'The root cause is a full disk on the node, this is certain.'; echo exiting; exit 1"]
        env:
        - name: STRIPE_KEY
          value: sk_canary_CnryK7stripeKey0123456789
